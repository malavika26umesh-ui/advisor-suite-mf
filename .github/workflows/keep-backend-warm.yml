name: Keep Render backend warm

# Render's free tier spins the backend down after ~15 min of inactivity, and a
# cold start takes 30-60s — long enough that the frontend's request times out and
# pages (e.g. the Education Hub) render as silently empty. This workflow pings the
# backend's /health endpoint every 10 minutes so it never goes to sleep.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          echo "Pinging backend at $(date -u)"
          # Render free tier cold starts can take well over 60s. If GitHub's
          # scheduler skips/delays runs, the backend may be asleep when we hit
          # it, so allow a long per-request timeout AND retry — a slow wake-up
          # should succeed on a later attempt, not fail the job (curl exit 28).
          for attempt in 1 2 3; do
            code=$(curl -s -m 150 --connect-timeout 30 -o /dev/null \
              -w "%{http_code}" https://advisor-suite-mf.onrender.com/health || echo "000")
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "Not ready (likely a cold start) — waiting 30s before retry..."
            sleep 30
          done
          echo "::error::Backend did not return 200 after 3 attempts"
          exit 1
